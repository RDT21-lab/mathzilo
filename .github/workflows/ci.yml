# Mathzilo — integración continua y despliegue.
# Cada cambio pasa tipos, pruebas (motor con 10.000 semillas, datos, sincronización, idiomas) y compilación.
# En la rama main, además, publica la imagen Docker en GitHub Container Registry y, si están
# configurados los secretos DEPLOY_HOST / DEPLOY_USER / DEPLOY_KEY, la despliega en el servidor por SSH.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pruebas de extremo a extremo (Playwright)
        run: npx playwright install --with-deps chromium && npm run e2e

  image:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nombre de la imagen en minúsculas (GHCR no admite mayúsculas)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}:latest

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en el servidor (solo si hay secretos)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$HOST" ]; then echo "Sin DEPLOY_HOST: se omite el despliegue"; exit 0; fi
          mkdir -p ~/.ssh && echo "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "cd ~/mathzilo && docker compose pull && docker compose up -d"
