/* Layout: página tranquila con un dispositivo en el centro (tablet 1024×680 para el niño,
   móvil 390×800 para el padre). El dispositivo se escala con transform para caber en cualquier pantalla.
   Look comprometido a un único mundo visual oscuro (azul noche + dorado), definido en los tokens. */
:root {
  --navy: #0A1230; --card: #12275F; --card-raised: #1B3680; --card-hi: #25479F;
  --gold: #FFC933; --gold-deep: #E0A200; --gold-ink: #3A2A00;
  --bone: #F7F7FA; --muted: #A9B6E0; --line: #2A4390;
  --ok: #3DDC97; --soft-fail: #FF8A5B; --shield: #9AA8FF;
  --page: #070C22;
  --font: "Lexend", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--page); }
body {
  margin: 0; background: var(--page); color: var(--bone);
  font-family: var(--font); font-size: 16px; line-height: 1.5;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-variant-numeric: tabular-nums;
}
button { font-family: inherit; color: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Página alrededor del dispositivo ---------- */
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand .mk { width: 40px; height: 40px; flex: none; }
.brand .wm { height: 26px; width: auto; }
.head p { margin: 0; color: var(--muted); font-size: 14px; max-width: 46ch; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
.seg { display: inline-flex; background: var(--card); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 10px 16px; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); font-weight: 700; }
.tag-demo { font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 6px 12px; }
.jump { display: flex; flex-wrap: wrap; gap: 8px; }
.jump button { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 8px 14px; font-size: 14px; cursor: pointer; min-height: 40px; }
.jump button[aria-current="true"] { background: var(--card-raised); color: var(--bone); border-color: var(--gold); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.stagebox { display: flex; justify-content: center; width: 100%; }
.scaler { position: relative; }
.device { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; border-radius: 28px; border: 1px solid var(--line); background-color: var(--navy); background-image: var(--stars); color: var(--bone); }
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 8px; }
.notes section { background: var(--card); border-radius: 16px; padding: 18px 20px; min-width: 0; }
.notes h2 { font-size: 16px; margin: 0 0 8px; font-weight: 700; }
.notes ol, .notes ul { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 6px; }

/* ---------- Componentes del dispositivo ---------- */
.device svg { display: block; }
.btn { font-weight: 700; border: 0; border-radius: 18px; min-height: 56px; padding: 0 28px; font-size: 20px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: transform .15s, background .15s; }
.btn.sm { font-size: 17px; padding: 0 20px; border-radius: 16px; }
.btn-gold { background: var(--gold); color: var(--gold-ink); box-shadow: 0 4px 0 var(--gold-deep); }
.btn-gold:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-deep); }
.btn-gold[disabled] { background: #34467f; color: #7b89bb; box-shadow: none; cursor: not-allowed; transform: none; }
.btn-line { background: transparent; border: 2px solid var(--line); color: var(--bone); }
.btn-line:hover { border-color: var(--muted); }
.btn-ok { background: var(--ok); color: #05301e; box-shadow: 0 4px 0 #22a370; }
.btn-ok:active { transform: translateY(3px); box-shadow: 0 1px 0 #22a370; }
.icon-btn { width: 56px; height: 56px; border-radius: 16px; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { border-color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 18px; border: 0; }
button.pill { cursor: pointer; }
button.pill:hover { background: var(--card-raised); }
.pill.gold { color: var(--gold); }
.card { background: var(--card); border-radius: 24px; padding: 22px 24px; }
.muted { color: var(--muted); }
.gold { color: var(--gold); }
.chip { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 15px; font-weight: 500; background: var(--card-raised); }
.chip.good { background: rgba(61,220,151,.16); color: var(--ok); }
.chip.bad { background: rgba(255,138,91,.16); color: var(--soft-fail); }
.caps { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,201,51,.5); } 50% { box-shadow: 0 0 0 8px rgba(255,201,51,0); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.rise { animation: rise .45s both; animation-delay: calc(var(--i, 0) * .28s); }
.pop { animation: pop .5s both; animation-delay: calc(var(--i, 0) * .28s); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Tablet (niño) ---------- */
.tscr { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 24px 40px 28px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; flex: none; }
.top .l, .top .r { display: flex; align-items: center; gap: 12px; }
.brand-in { display: flex; align-items: center; gap: 12px; }
.brand-in .mk { width: 44px; height: 44px; }
.brand-in .wm { height: 28px; width: auto; }
.ttl { font-size: 46px; font-weight: 800; margin: 14px 0 6px; text-align: center; line-height: 1.1; }
.sub { text-align: center; color: var(--muted); font-size: 20px; margin: 0; }

.pcards { display: flex; justify-content: center; align-items: center; gap: 28px; flex: 1; padding-bottom: 12px; }
.pcard { width: 252px; height: 366px; border-radius: 28px; background: var(--card); border: 3px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: transform .18s, border-color .18s; }
.pcard:hover, .pcard:focus-visible { border-color: var(--gold); transform: translateY(-6px); }
.pcard .nm { font-size: 30px; font-weight: 800; line-height: 1.1; }
.pcard .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

.home { display: grid; grid-template-columns: 430px 1fr; gap: 32px; flex: 1; min-height: 0; margin-top: 10px; }
.stagepane { position: relative; min-height: 0; }
.planet { position: absolute; left: 50%; bottom: 38px; width: 360px; height: 360px; margin-left: -180px; border-radius: 50%; background: var(--card); }
.stagepane .mascot { position: absolute; left: 50%; bottom: 52px; width: 370px; height: 370px; margin-left: -185px; animation: bob 4s ease-in-out infinite; }
.bubble { position: absolute; top: 4px; left: 8px; right: 8px; background: var(--bone); color: var(--navy); border-radius: 22px; padding: 14px 20px; font-weight: 500; font-size: 19px; line-height: 1.35; }
.bubble::after { content: ""; position: absolute; left: 70px; bottom: -14px; border: 14px solid transparent; border-top-color: var(--bone); border-bottom: 0; }
.nametag { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); white-space: nowrap; }
.rcol { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.streak .hd { display: flex; align-items: center; gap: 14px; }
.streak .big { font-size: 60px; font-weight: 800; line-height: 1; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 14px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); }
.dot.done { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.dot.shield { background: var(--shield); border-color: var(--shield); color: var(--navy); }
.dot.today { border: 2px dashed var(--gold); animation: pulse 2s infinite; }
.dot.miss { border-style: dotted; opacity: .6; }
.dot.future { opacity: .45; }
.shields { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 16px; color: var(--muted); }
.shields .sh { color: var(--shield); }
.shields .sh.off { opacity: .3; }
.starscard { display: flex; flex-direction: column; gap: 10px; }
.starscard .hd { display: flex; align-items: baseline; gap: 10px; }
.starscard .num { font-size: 56px; font-weight: 800; color: var(--gold); line-height: 1; }
.bar { height: 14px; border-radius: 7px; background: var(--navy); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 7px; }
.cta { margin-top: auto; }
.cta .btn { width: 100%; min-height: 78px; font-size: 28px; border-radius: 22px; }

.lens { display: flex; gap: 24px; justify-content: center; align-items: stretch; flex: 1; padding: 22px 0 14px; }
.lencard { width: 270px; border-radius: 28px; background: var(--card); border: 3px solid transparent; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: transform .18s, border-color .18s; }
.lencard:hover:not([disabled]), .lencard:focus-visible { border-color: var(--gold); transform: translateY(-6px); }
.lencard[disabled] { opacity: .45; cursor: not-allowed; }
.lencard .n { font-size: 92px; font-weight: 800; line-height: 1; color: var(--gold); }
.lencard .u { font-size: 22px; font-weight: 500; }
.note { text-align: center; color: var(--muted); font-size: 17px; margin: 0; }

.prog { flex: 1; display: flex; gap: 6px; }
.prog i { flex: 1; height: 12px; border-radius: 6px; background: #22397c; }
.prog i.done { background: var(--gold); }
.prog i.cur { background: #ffe59a; animation: pulse 1.6s infinite; }
.count { font-size: 18px; color: var(--muted); min-width: 130px; text-align: right; }
.minibanner { margin-top: 10px; background: rgba(154,168,255,.16); color: var(--shield); border-radius: 14px; padding: 8px 16px; font-weight: 500; font-size: 17px; text-align: center; }
.qgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; flex: 1; margin-top: 16px; min-height: 0; }
.qcard { background: var(--card); border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; position: relative; min-height: 0; padding: 20px; }
.qcard .skill { position: absolute; top: 18px; left: 22px; }
.qtext { font-size: 70px; font-weight: 800; line-height: 1.05; white-space: nowrap; }
.qtext .ans { color: var(--ok); }
.qcard .mascot { position: absolute; left: 14px; bottom: 6px; width: 150px; height: 150px; }
.qcard .gave { margin-top: 6px; font-size: 20px; }
.answers { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; flex: 1; }
.opt { border-radius: 24px; background: var(--card-raised); border: 3px solid transparent; font-size: 52px; font-weight: 800; cursor: pointer; min-height: 120px; transition: transform .12s, border-color .12s, background .12s; }
.opt:hover { background: var(--card-hi); }
.opt[aria-pressed="true"] { border-color: var(--gold); background: var(--card-hi); transform: scale(1.03); }
.numdisplay { height: 84px; border-radius: 20px; background: var(--navy); border: 3px solid var(--line); font-size: 52px; font-weight: 800; padding: 0 26px; display: flex; align-items: center; justify-content: flex-end; flex: none; }
.numdisplay.empty { color: #55659f; }
.numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex: 1; }
.nk { border-radius: 18px; background: var(--card-raised); border: 0; font-size: 32px; font-weight: 700; cursor: pointer; min-height: 56px; display: grid; place-items: center; }
.nk:hover { background: var(--card-hi); }
.nk.del { background: transparent; border: 2px solid var(--line); }
.answers .btn { width: 100%; min-height: 66px; font-size: 24px; flex: none; }
.fbcard { background: var(--card); border-radius: 28px; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; overflow: auto; }
.fbcard.ok { align-items: center; justify-content: center; text-align: center; gap: 10px; }
.fbcard.ok .big { font-size: 46px; font-weight: 800; color: var(--ok); }
.fbcard .stars-plus { font-size: 34px; font-weight: 800; color: var(--gold); animation: pop .5s both .1s; }
.fbcard h3 { margin: 0; font-size: 26px; font-weight: 800; line-height: 1.15; }
.fbcard p { margin: 0; font-size: 18px; color: var(--bone); }
.cmp { display: flex; gap: 8px; flex-wrap: wrap; }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; counter-reset: s; }
.steps li { counter-increment: s; font-size: 18px; line-height: 1.35; display: flex; gap: 12px; align-items: flex-start; }
.steps li::before { content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); font-weight: 800; font-size: 15px; display: grid; place-items: center; margin-top: 1px; }
.fbcard .btn { margin-top: auto; width: 100%; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipn { min-width: 42px; height: 42px; padding: 0 8px; border-radius: 12px; background: var(--navy); display: grid; place-items: center; font-weight: 700; font-size: 18px; }
.chipn.hi { background: var(--gold); color: var(--gold-ink); }
.frames { display: flex; gap: 14px; flex-wrap: wrap; }
.frame { display: grid; grid-template-columns: repeat(5, 24px); gap: 4px; padding: 6px; background: var(--navy); border-radius: 10px; }
.fd { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #31478f; }

.fd.b { background: var(--gold); border-color: var(--gold); }
.cols { display: inline-grid; grid-template-columns: 26px 38px 38px; gap: 2px 4px; align-items: center; justify-items: center; background: var(--navy); border-radius: 12px; padding: 10px 14px; font-size: 28px; font-weight: 800; line-height: 1.1; }
.cols .cy { color: var(--soft-fail); font-size: 18px; }

.cols small { color: var(--soft-fail); font-size: 16px; margin-right: 1px; }

.tot { display: flex; justify-content: space-between; align-items: baseline; font-size: 24px; font-weight: 700; padding-top: 6px; }
.tot b { font-size: 50px; color: var(--gold); line-height: 1; }
.evo { display: flex; align-items: center; gap: 14px; background: rgba(154,168,255,.16); border-radius: 18px; padding: 10px 16px; }
.evo .mascot { width: 84px; height: 84px; flex: none; }
.resbtns { display: flex; gap: 12px; margin-top: auto; }
.resbtns .btn { flex: 1; }
.exa { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: rgba(154,168,255,.18); color: var(--shield); margin-left: 8px; vertical-align: middle; }

.mas { display: grid; grid-template-columns: 430px 1fr; gap: 32px; flex: 1; min-height: 0; margin-top: 10px; }

.masl > :not(.planet) { position: relative; }
.masl .mascot { position: relative; width: 340px; height: 340px; margin-top: 2px; }
.nameedit { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 18px; padding: 6px 8px 6px 18px; }

.masr { display: flex; flex-direction: column; gap: 10px; min-height: 0; }

.step { display: flex; align-items: center; gap: 16px; background: var(--card); border: 3px solid transparent; border-radius: 20px; padding: 8px 18px 8px 10px; cursor: pointer; text-align: left; font: inherit; width: 100%; }
.step[aria-pressed="true"] { border-color: var(--shield); }

.step .mascot { width: 76px; height: 76px; flex: none; background: var(--navy); border-radius: 16px; }
.step.lock .mascot svg, .sil svg { filter: brightness(0) invert(.8) opacity(.3); }

.kindsel { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 15px; }

.overlay { position: absolute; inset: 0; background: rgba(7,12,34,.84); display: flex; align-items: center; justify-content: center; z-index: 30; }

.led b.pos { color: var(--ok); }
.led b.neg { color: var(--soft-fail); }

.sumbar { background: var(--card-raised); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
.hist { display: flex; flex-direction: column; }

.sect { background: var(--card); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }

.srow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; min-height: 56px; }

      'Q' + (cx - k) + ' ' + (cy + k) + ' ' + (cx - s) + ' ' + cy +

  /* ---------- Robot ---------- */
  function robot(stage, emo) {

      '<rect x="40" y="52" width="120" height="88" rx="28" fill="' + C.rob + '"/>' +

    if (emo === 'happy') {
      h += '<circle cx="82" cy="94" r="7.5" fill="' + C.gold + '"/><circle cx="118" cy="94" r="7.5" fill="' + C.gold + '"/>' +
        '<circle cx="84.5" cy="91.5" r="2.4" fill="#fff"/><circle cx="120.5" cy="91.5" r="2.4" fill="#fff"/>' +
        line('M90 109Q100 118 110 109', C.gold, 5);
    } else if (emo === 'thinking') {
      h += '<circle cx="84" cy="94" r="7.5" fill="' + C.gold + '"/><circle cx="120" cy="91" r="7.5" fill="' + C.gold + '"/>' +
        '<circle cx="86.5" cy="91.5" r="2.4" fill="#fff"/><circle cx="122.5" cy="88.5" r="2.4" fill="#fff"/>' +
        line('M70 80L94 83M108 77Q120 71 132 77', C.lav, 4.5) +
        line('M92 112L108 112', C.gold, 5);

      h += '<path d="' + starPath(82, 94, 11, 5) + '" fill="' + C.gold + '" stroke="' + C.gold + '" stroke-width="2" stroke-linejoin="round"/>' +
        '<path d="' + starPath(118, 94, 11, 5) + '" fill="' + C.gold + '" stroke="' + C.gold + '" stroke-width="2" stroke-linejoin="round"/>' +
        '<path d="M88 106Q100 128 112 106Z" fill="' + C.gold + '"/>';

    h += headgear(stage, g) + '</g>';
    out += h;
    if (emo === 'thinking') {
      out += line('M128 176Q140 160 122 146', C.robD, 14) + '<circle cx="121" cy="144" r="8.5" fill="' + C.robL + '"/>';
      out += thinkDots();
    }
    if (emo === 'cheering') out += cheerSparks(stage);
    if (stage === 4) out += orbitFront();

  }

  /* ---------- API ---------- */
  function svg(kind, stage, emotion, opts) {
    opts = opts || {};
    var emo = emotion;
    for (var i = 0; i < EMOTIONS.length; i++) if (EMOTIONS[i].id === emotion) emo = EMOTIONS[i].key;
    var body = kind === 'robot' ? robot(stage, emo) : fox(stage, emo);
    var title = (opts.title !== undefined) ? opts.title : (kind + ' · ' + STAGES[stage - 1].name + ' · ' + emotion);
    var size = opts.size ? ' width="' + opts.size + '" height="' + opts.size + '"' : '';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"' + size + ' role="img" aria-label="' + title + '"><title>' + title + '</title>' + body + '</svg>';
  }
  function stageFor(bestStreak) {
    var s = 1;
    for (var i = 0; i < STAGES.length; i++) if (bestStreak >= STAGES[i].bestStreak) s = i + 1;
    return s;
  }

  var api = { svg: svg, stageFor: stageFor, STAGES: STAGES, EMOTIONS: EMOTIONS, KINDS: KINDS, colors: C };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.StarMascots = api;
})(typeof window !== 'undefined' ? window : this);

<script>
/* Mathzilo — motor de preguntas y reglas de estrellas (prototipo, niveles 1 a 3).
   Cada pregunta nace de un generador que calcula la respuesta con aritmética entera,
   así que una respuesta marcada como correcta nunca puede ser falsa.
   Cada distractor lleva la etiqueta del error típico que representa; esa etiqueta
   activa la explicación exacta (plantillas con huecos, nada de IA en directo).      */
(function (root) {
  'use strict';

  /* ---------- Utilidades ---------- */
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function ri(r, lo, hi) { return lo + Math.floor(r() * (hi - lo + 1)); }
  function shuffle(r, arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(r() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function swapDigits(n) { return parseInt(String(n).split('').reverse().join(''), 10); }

  var SKILLS = {
    'sum-20':      { name: 'Sumas hasta 20', level: 1 },
    'sub-20':      { name: 'Restas hasta 20', level: 1 },
    'add-carry':   { name: 'Sumas con llevada', level: 2 },
    'sub-borrow':  { name: 'Restas con llevada', level: 2 },
    'mult-table':  { name: 'Tablas de multiplicar', level: 3 },
    'div-exact':   { name: 'Divisiones exactas', level: 3 }
  };
  var POOL = { 1: ['sum-20', 'sub-20'], 2: ['add-carry', 'sub-borrow'], 3: ['mult-table', 'div-exact'] };
  var NUM_SHARE = { 'sum-20': 0, 'sub-20': 0, 'add-carry': 0.25, 'sub-borrow': 0.25, 'mult-table': 0.5, 'div-exact': 0.5 };

  /* Nombres de los errores típicos (para el panel del padre) */
  var ERROR_NAMES = {
    'olvido-llevada': 'Olvida la llevada',
    'llevada-doble': 'Suma la llevada dos veces',
    'olvido-prestamo': 'Se equivoca al pedir prestada una decena',
    'resta-al-reves': 'Resta al revés las unidades',
    'resta-en-vez': 'Resta en lugar de sumar o al contrario',
    'suma-en-vez': 'Suma en lugar de restar o multiplicar',
    'tabla-cercana': 'Confunde con una tabla vecina',
    'cifras-cambiadas': 'Cambia el orden de las cifras',
    'decena-mal': 'Se equivoca en una decena',
    'cifra-copiada': 'Copia uno de los números',
    'cuenta-mal': 'Se equivoca por poco al contar'
  };

  /* ---------- Generadores ---------- */
  function build(gen, level, text, answer, data, cands) {
    return { gen: gen, level: level, skill: SKILLS[gen].name, text: text, answer: answer, data: data, cands: cands };
  }

  var GENS = {
    'sum-20': function (r) {
      var a, b;
      do { a = ri(r, 6, 9); b = ri(r, 4, 9); } while (a + b < 11);
      var ans = a + b;
      return build('sum-20', 1, a + ' + ' + b, ans, { a: a, b: b }, [
        { v: ans - 1, tag: 'cuenta-mal' }, { v: ans + 1, tag: 'cuenta-mal' },
        { v: Math.abs(a - b), tag: 'resta-en-vez' },
        { v: ans - 10, tag: 'decena-mal' }, { v: ans + 10, tag: 'decena-mal' }
      ]);
    },
    'sub-20': function (r) {
      var a = ri(r, 11, 18);
      var lo = Math.max(3, a - 9), hi = Math.min(9, a - 2);
      var b = ri(r, lo, hi), ans = a - b;
      return build('sub-20', 1, a + ' − ' + b, ans, { a: a, b: b }, [
        { v: a + b, tag: 'suma-en-vez' },
        { v: ans - 1, tag: 'cuenta-mal' }, { v: ans + 1, tag: 'cuenta-mal' },
        { v: Math.abs((a % 10) - b), tag: 'resta-al-reves' },
        { v: ans + 10, tag: 'decena-mal' }
      ]);
    },
    'add-carry': function (r) {
      var a, b;
      do { a = ri(r, 13, 86); b = ri(r, 13, 86); } while ((a % 10) + (b % 10) < 10 || a + b > 99);
      var ans = a + b;
      return build('add-carry', 2, a + ' + ' + b, ans, { a: a, b: b }, [
        { v: ans - 10, tag: 'olvido-llevada' }, { v: ans + 10, tag: 'llevada-doble' },
        { v: ans - 1, tag: 'cuenta-mal' }, { v: ans + 1, tag: 'cuenta-mal' }
      ]);
    },
    'sub-borrow': function (r) {
      var a, b, au, bu;
      do {
        a = ri(r, 31, 95); b = ri(r, 12, a - 5); au = a % 10; bu = b % 10;
      } while (au >= bu);
      var ans = a - b, ad = Math.floor(a / 10), bd = Math.floor(b / 10);
      var cands = [
        { v: (ad - bd) * 10 + (bu - au), tag: 'olvido-prestamo' },
        { v: ans - 1, tag: 'cuenta-mal' }, { v: ans + 1, tag: 'cuenta-mal' },
        { v: ans + 10, tag: 'decena-mal' }, { v: ans - 10, tag: 'decena-mal' }
      ];
      if (a + b <= 99) cands.push({ v: a + b, tag: 'suma-en-vez' });
      return build('sub-borrow', 2, a + ' − ' + b, ans, { a: a, b: b }, cands);
    },
    'mult-table': function (r) {
      var a = ri(r, 3, 9), b = ri(r, 3, 9), ans = a * b;
      var cands = [
        { v: a * (b + 1), tag: 'tabla-cercana' }, { v: a * (b - 1), tag: 'tabla-cercana' },
        { v: (a + 1) * b, tag: 'tabla-cercana' }, { v: (a - 1) * b, tag: 'tabla-cercana' },
        { v: a + b, tag: 'suma-en-vez' },
        { v: ans + 10, tag: 'decena-mal' }, { v: ans - 10, tag: 'decena-mal' }
      ];
      if (ans >= 10) cands.push({ v: swapDigits(ans), tag: 'cifras-cambiadas' });
      return build('mult-table', 3, a + ' × ' + b, ans, { a: a, b: b }, cands);
    },
    'div-exact': function (r) {
      var q = ri(r, 3, 9), b = ri(r, 3, 9), a = q * b;
      return build('div-exact', 3, a + ' ÷ ' + b, q, { a: a, b: b, q: q }, [
        { v: q + 1, tag: 'tabla-cercana' }, { v: q - 1, tag: 'tabla-cercana' },
        { v: b, tag: 'cifra-copiada' }, { v: a - b, tag: 'resta-en-vez' },
        { v: q + 2, tag: 'cuenta-mal' }
      ]);
    }
  };

  /* Elige 3 distractores distintos y devuelve las 4 opciones mezcladas */
  function pickOptions(r, answer, cands) {
    var seen = {}; seen[answer] = 1;
    var uniq = [];
    shuffle(r, cands).forEach(function (c) {
      if (c.v >= 0 && c.v === Math.floor(c.v) && !seen[c.v]) { seen[c.v] = 1; uniq.push(c); }
    });
    var chosen = uniq.slice(0, 3);
    var k = 1;
    while (chosen.length < 3) {
      [answer + k, answer - k].forEach(function (v) {
        if (chosen.length < 3 && v >= 0 && !seen[v]) { seen[v] = 1; chosen.push({ v: v, tag: 'cuenta-mal' }); }
      });
      k++;
    }
    return shuffle(r, chosen.concat([{ v: answer, tag: 'ok' }]));
  }

  function makeQuestion(genId, seed) {
    var r = mulberry32(seed);
    var q = GENS[genId](r);
    q.options = pickOptions(r, q.answer, q.cands);
    q.type = (r() < NUM_SHARE[genId]) ? 'num' : 'mc';
    q.seed = seed;
    return q;
  }

  /* Otra pregunta del mismo tipo (mini-reto tras un fallo) */
  function similar(q, seed) {
    var n = makeQuestion(q.gen, seed), tries = 0;
    while (n.text === q.text && tries < 20) { n = makeQuestion(q.gen, seed + 1000 + tries); tries++; }
    return n;
  }

  function makeTest(level, n, seed) {
    var r = mulberry32(seed), lv = Math.min(Math.max(level, 1), 3);
    var pool = POOL[lv], lower = lv > 1 ? POOL[lv - 1] : null;
    var qs = [], seen = {};
    for (var i = 0; i < n; i++) {

    understood: function () {
      var t = S.test;
      t.mini = E.similar(t.qs[t.i], Math.floor(Math.random() * 1e9));
      t.phase = 'mini'; t.sel = null; t.entry = '';
    },
    pause: function () { toast('Test en pausa. Lo retomas desde «Empezar».'); go('inicio'); },
    sheet: function (v) { S.sheet = v; },
    closesheet: function () { S.sheet = null; },
    preview: function (v) { var n = parseInt(v, 10); S.preview = S.preview === n ? null : n; },
    emo: function (v) { S.emo = v; },
    kind: function (v) { kid().kind = v; },
    pin: function (v) { pinKey(S.pin, v, function () { S.authed = true; S.lastParent = Date.now(); go('panel'); }); },
    noop: function () {},
    unlock: function () { S.pin.lockedUntil = 0; S.pin.tries = 0; S.pin.err = ''; },
    forgot: function () { toast('En la app real se restablece desde el email de la cuenta.'); },
    openkid: function (v) { S.openKid = S.openKid === v ? null : v; },
    level: function (v, el) { var k = kid(v); k.level = Math.max(1, Math.min(6, k.level + parseInt(el.getAttribute('data-d'), 10))); k.recent = []; toast(k.name + ' pasa a nivel ' + k.level + '.'); },
    dismiss: function (v) { kid(v).recent = []; toast('De acuerdo. Te avisaremos si sigue igual.'); },
    rkid: function (v) { S.redeem.kid = v; S.redeem.reward = null; },
    rrew: function (v) { S.redeem.reward = S.redeem.reward === v ? null : v; if (S.redeem.reward) S.redeem.custom = ''; },
    askconfirm: function () { S.confirm = { entry: '', err: '', tries: 0 }; },
    cancelconfirm: function () { S.confirm = null; },
    cpin: function (v) {
      pinKey(S.confirm, v, function () {
        var R = S.redeem, amt = redeemAmount(), k = kid(R.kid);
        if (amt.n <= 0 || balance(k.id) - amt.n < 0) { S.confirm = null; return; }
        S.ledger.push({ id: nextId(), kid: k.id, day: 0, type: 'canje', amount: -amt.n, note: amt.what });
        S.confirm = null; R.reward = null; R.custom = ''; R.reason = '';
        toast('Hecho: −' + amt.n + ' ★ a ' + k.name + '. Ya lo ve en su historial.');
      });
      if (S.confirm && S.confirm.tries >= 5) { S.confirm = null; S.authed = false; S.pin.lockedUntil = Date.now() + 15 * 60 * 1000; }
    },
    compensate: function (v) {
      var e = S.ledger.filter(function (x) { return x.id === v; })[0];
      if (!e) return;
      e.fixed = true;
      S.ledger.push({ id: nextId(), kid: e.kid, day: 0, type: 'ajuste', amount: -e.amount, note: 'Corrección: ' + e.note });
      toast('Apunte de compensación añadido: +' + (-e.amount) + ' ★');
    },
    step: function (v, el) {
      var d = parseInt(el.getAttribute('data-d'), 10);
      if (v.indexOf('level:') === 0) { var k = kid(v.slice(6)); k.level = Math.max(1, Math.min(6, k.level + d)); return; }
      var s = STEP[v]; s[1](Math.max(s[2], Math.min(s[3], s[0]() + d * s[4])));
    },
    maxlen: function (v, el) { kid(v).maxLen = parseInt(el.getAttribute('data-n'), 10); },
    delrew: function (v) { S.rewards = S.rewards.filter(function (r) { return r.id !== v; }); },
    addrew: function () { S.rewards.push({ id: 'r' + nextId(), name: 'Nuevo premio', cost: 50, note: '' }); },
    shields: function (v) { S.shieldsOn = v === '1'; },
    lang: function (v) { if (v !== 'es') toast('Inglés, francés y alemán llegan en la fase 8.'); },
    demo: function (v) { toast(v); },
    logout: function () { S.authed = false; S.pin.entry = ''; S.fresh = true; }
  };
  var INPUT = {
    petName: function (v) { kid().petName = v.trim() || kid().petName; return false; },
    custom: function (v) { S.redeem.custom = v.replace(/\D/g, '').slice(0, 4); if (S.redeem.custom) S.redeem.reward = null; return true; },
    reason: function (v) { S.redeem.reason = v.slice(0, 40); return true; },
    rname: function (v, el) { S.rewards.forEach(function (r) { if (r.id === el.getAttribute('data-id')) r.name = v; }); return false; },
    rcost: function (v, el) { var n = parseInt(v.replace(/\D/g, ''), 10); S.rewards.forEach(function (r) { if (r.id === el.getAttribute('data-id') && n > 0) r.cost = n; }); return false; },
    equivalence: function (v) { S.equivalence = v; return false; }
  };

  function boot() {
    app = document.getElementById('app');
    app.addEventListener('click', function (ev) {
      var el = ev.target.closest('[data-act]');
      if (!el || el.disabled) return;
      if (el.getAttribute('data-act') === 'closesheet' && ev.target.closest('[data-stop]') && el.classList.contains('overlay')) return;
      if (el.getAttribute('data-act') === 'openkid' && ev.target.closest('[data-stop]')) return;
      if (S.device === 'phone' && S.authed && Date.now() - S.lastParent > 5 * 60 * 1000) { S.authed = false; S.fresh = true; render(); return; }
      if (S.device === 'phone') S.lastParent = Date.now();
      ACT[el.getAttribute('data-act')](el.getAttribute('data-v'), el);
      render();
    });
    app.addEventListener('keydown', function (ev) {
      var el = ev.target;
      if ((ev.key === 'Enter' || ev.key === ' ') && el.getAttribute && el.getAttribute('role') === 'button') { ev.preventDefault(); el.click(); }
    });
    app.addEventListener('input', function (ev) {
      var el = ev.target, k = el.getAttribute('data-input');
      if (k && INPUT[k](el.value, el)) render();
    });
    app.addEventListener('change', function (ev) { if (ev.target.getAttribute('data-input')) render(); });
    document.addEventListener('keydown', function (ev) {
      if (S.device !== 'tablet' || S.screen !== 'pregunta' || !S.test || /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
      var t = S.test, q = curQ(), asking = t.phase === 'ask' || t.phase === 'mini';
      if (asking && q.type === 'num' && /^[0-9]$/.test(ev.key)) ACT.key(ev.key);
      else if (asking && q.type === 'num' && ev.key === 'Backspace') ACT.key('del');
      else if (asking && q.type === 'mc' && /^[1-4]$/.test(ev.key)) ACT.opt(String(parseInt(ev.key, 10) - 1));
      else if (ev.key === 'Enter' && asking) check();
      else return;
      ev.preventDefault(); render();
    });
    window.addEventListener('resize', fit);
    render();
    // La barra de scroll aparece después del primer render y estrecha la página: volver a ajustar
    if (window.ResizeObserver) new ResizeObserver(fit).observe(app);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
